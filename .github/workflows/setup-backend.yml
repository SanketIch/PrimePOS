name: 'Setup Terraform State Backend'

# This workflow creates the S3 bucket and DynamoDB table for Terraform state
# Run this ONCE before running the main terraform workflow

on:
  workflow_dispatch:
    inputs:
      bucket_name:
        description: 'S3 bucket name for Terraform state'
        required: true
        default: 'ritedevops-terraform-state'
      dynamodb_table:
        description: 'DynamoDB table name for state locking'
        required: true
        default: 'devops-terraform-state-lock'

permissions:
  contents: read

jobs:
  setup-backend:
    name: 'Setup Terraform Backend'
    runs-on: ubuntu-latest
    
    steps:
      - name: Configure AWS Credentials (with SSO Session Token)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}  # ⭐ Added session token
          aws-region: us-east-1

      - name: Verify AWS Identity
        run: |
          echo "Verifying AWS credentials..."
          aws sts get-caller-identity

      - name: Create S3 Bucket for Terraform State
        run: |
          # Check if bucket exists
          if aws s3 ls "s3://${{ github.event.inputs.bucket_name }}" 2>&1 | grep -q 'NoSuchBucket'
          then
            echo "Creating S3 bucket..."
            aws s3api create-bucket \
              --bucket ${{ github.event.inputs.bucket_name }} \
              --region us-east-1
            
            # Enable versioning
            aws s3api put-bucket-versioning \
              --bucket ${{ github.event.inputs.bucket_name }} \
              --versioning-configuration Status=Enabled
            
            # Enable encryption
            aws s3api put-bucket-encryption \
              --bucket ${{ github.event.inputs.bucket_name }} \
              --server-side-encryption-configuration '{
                "Rules": [{
                  "ApplyServerSideEncryptionByDefault": {
                    "SSEAlgorithm": "AES256"
                  },
                  "BucketKeyEnabled": true
                }]
              }'
            
            # Block public access
            aws s3api put-public-access-block \
              --bucket ${{ github.event.inputs.bucket_name }} \
              --public-access-block-configuration \
                "BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true"
            
            echo "✅ S3 bucket created successfully"
          else
            echo "✅ S3 bucket already exists"
          fi

      - name: Create DynamoDB Table for State Locking
        run: |
          # Check if table exists
          if aws dynamodb describe-table --table-name ${{ github.event.inputs.dynamodb_table }} 2>&1 | grep -q 'ResourceNotFoundException'
          then
            echo "Creating DynamoDB table..."
            aws dynamodb create-table \
              --table-name ${{ github.event.inputs.dynamodb_table }} \
              --attribute-definitions AttributeName=LockID,AttributeType=S \
              --key-schema AttributeName=LockID,KeyType=HASH \
              --billing-mode PAY_PER_REQUEST \
              --tags Key=Purpose,Value=TerraformStateLock Key=ManagedBy,Value=GitHubActions
            
            echo "✅ DynamoDB table created successfully"
          else
            echo "✅ DynamoDB table already exists"
          fi

      - name: Create Summary
        run: |
          echo "## Terraform Backend Setup Complete! 🎉" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Resources Created:" >> $GITHUB_STEP_SUMMARY
          echo "- **S3 Bucket**: \`${{ github.event.inputs.bucket_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **DynamoDB Table**: \`${{ github.event.inputs.dynamodb_table }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next Steps:" >> $GITHUB_STEP_SUMMARY
          echo "1. Update \`main.tf\` with the bucket name in the backend configuration" >> $GITHUB_STEP_SUMMARY
          echo "2. Commit and push your changes" >> $GITHUB_STEP_SUMMARY
          echo "3. The main Terraform workflow will now work with state management" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ⚠️ Important - SSO Credential Expiry:" >> $GITHUB_STEP_SUMMARY
          echo "Remember to refresh your GitHub secrets with new SSO credentials when they expire!" >> $GITHUB_STEP_SUMMARY
