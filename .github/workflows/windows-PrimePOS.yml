name: .NET Build, Test Case Execution and Code Analysis

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]

jobs:
  code-analysis:
    name: Code Analysis using CodeQL
    runs-on: windows-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v1.3.1

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v1

    - name: Restore NuGet packages
      run: nuget restore ./src/PrimePOS/PrimePOS.sln

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: csharp

    - name: Build code
      run: msbuild ./src/PrimePOS/PrimePOS.sln /p:Configuration=Release

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        output: codeql-results
        format: sarif

    - name: Check for High severity vulnerabilities
      run: |
        $sarif = Get-Content codeql-results/codeql.sarif | ConvertFrom-Json
        $findings = $sarif.runs.results | Where-Object {
            $_.properties.severity -in @("high","critical") -or
            $_.rule.severity -in @("high","critical")
        }
        if ($findings.Count -gt 0) {
          Write-Host "❌ Found $($findings.Count) High/Critical severity vulnerabilities."
          exit 1
        } else {
          Write-Host "✅ No High or Critical vulnerabilities found."
        }
