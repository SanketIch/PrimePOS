name: .NET Build and CodeQL Analysis

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]

jobs:
  test-execution:
    name: Execute Tests
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v1.3.1

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v1

    - name: Restore NuGet packages
      run: nuget restore ./src/PrimePOS/PrimePOS.sln

    - name: Build solution
      run: msbuild ./src/PrimePOS/PrimePOS.sln /p:Configuration=Release

    - name: Upload Build Output
      uses: actions/upload-artifact@v4
      with:
        name: PrimePOS-build-output
        path: ./src/PrimePOS/

    - name: Install VSTest Console
      uses: darenm/Setup-VSTest@v1

    - name: Execute Tests via Script
      run: pwsh .github/workflows/scripts/run-tests.ps1

    - name: Upload TRX Results
      uses: actions/upload-artifact@v4
      with:
        name: TestResults_TRX
        path: TestResults/*.trx

    - name: Upload CSV Results
      uses: actions/upload-artifact@v4
      with:
        name: TestResults_CSV
        path: TestResults/TestResults.csv

  codeql-analysis:
    name: CodeQL Analysis
    runs-on: windows-latest
    needs: test-execution
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v1.3.1

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v1

    - name: Restore NuGet packages
      run: nuget restore ./src/PrimePOS/PrimePOS.sln

    - name: Download Build Output
      uses: actions/download-artifact@v4
      with:
        name: PrimePOS-build-output
        path: ./src/PrimePOS/

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: csharp

    # No need to rebuild again; CodeQL can analyze downloaded binaries

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
